# Test Configuration
# Uses test resources for database provisioning

micronaut.security.token.jwt.signatures.secret.generator.secret=pleaseChangeThisSecretForANewOne
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml
datasources.default.db-type=mysql
datasources.default.dialect=MYSQL
micronaut.application.name=anonymouswall
micronaut.security.authentication=bearer
datasources.default.driver-class-name=com.mysql.cj.jdbc.Driver
datasources.default.url=jdbc:mysql://localhost:3306/anonymous_wall
datasources.default.username=root
datasources.default.password=
redis.uri=redis://localhost:6379
micronaut.testresources.enabled=true
context-path=/

# Cache Configuration for Tests
micronaut.caches.blocked-users.maximum-size=100
micronaut.caches.blocked-users.expire-after-write=1m
micronaut.caches.blocked-users.expire-after-access=30s
micronaut.caches.user-block-sets.maximum-size=1000
micronaut.caches.user-block-sets.expire-after-write=5m
micronaut.caches.user-block-sets.expire-after-access=2m
