# Application Configuration - Production Ready
# Use environment variables for sensitive data in production
# Or use application-dev.properties for local development with hardcoded values

# Logging Configuration - can be overridden via LOG_DIR environment variable
LOG_DIR=${LOG_DIR:./logs}

micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET:pleaseChangeThisSecretForANewOne}
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml
datasources.default.db-type=${DB_TYPE:mysql}
datasources.default.dialect=${DB_DIALECT:MYSQL}
micronaut.application.name=anonymouswall
micronaut.security.authentication=bearer
datasources.default.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
datasources.default.url=${DATABASE_URL:jdbc:mysql://localhost:3306/anonymous_wall}
datasources.default.username=${DATABASE_USER:root}
datasources.default.password=${DATABASE_PASSWORD:}
redis.uri=${REDIS_URI:redis://localhost:6379}
micronaut.testresources.enabled=false

context-path=/

# Management Endpoints Configuration
# Health endpoint - publicly accessible for load balancer health checks
endpoints.health.enabled=true
endpoints.health.sensitive=false

# Enable additional management endpoints
endpoints.info.enabled=true
endpoints.info.sensitive=true
endpoints.beans.enabled=true
endpoints.beans.sensitive=true
endpoints.env.enabled=true
endpoints.env.sensitive=true
endpoints.loggers.enabled=true
endpoints.loggers.sensitive=true
endpoints.refresh.enabled=true
endpoints.refresh.sensitive=true

# Control Panel Configuration
# Access the admin dashboard at /control-panel
endpoints.control-panel.enabled=true
endpoints.control-panel.sensitive=true

# Security Intercept URL Map - Secure management endpoints
# Health endpoint remains publicly accessible for load balancers
micronaut.security.intercept-url-map[0].pattern=/health
micronaut.security.intercept-url-map[0].access[0]=permitAll()

# Secure all management endpoints (requires authentication)
# Note: Only endpoints explicitly enabled above are secured here
# Any new management endpoint should be added to this list
micronaut.security.intercept-url-map[1].pattern=/control-panel/**
micronaut.security.intercept-url-map[1].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[2].pattern=/beans
micronaut.security.intercept-url-map[2].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[3].pattern=/info
micronaut.security.intercept-url-map[3].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[4].pattern=/env
micronaut.security.intercept-url-map[4].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[5].pattern=/loggers
micronaut.security.intercept-url-map[5].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[6].pattern=/loggers/**
micronaut.security.intercept-url-map[6].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[7].pattern=/refresh
micronaut.security.intercept-url-map[7].access[0]=isAuthenticated()

