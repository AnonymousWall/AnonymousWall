# Local Development Configuration
# Your local development settings preserved exactly

# Logging Configuration - writes to project root ./logs directory
LOG_DIR=./logs

# Logging levels for debugging
logging.level.com.anonymous.wall.controller=INFO
logging.level.com.anonymous.wall.service=INFO

micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET:devOnlyJwtSecret2024DoNotUseInProductionMustBeAtLeast256Bits!!}
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml
datasources.default.db-type=oracle
datasources.default.dialect=ORACLE
micronaut.application.name=anonymouswall
micronaut.security.authentication=bearer
datasources.default.driver-class-name=oracle.jdbc.OracleDriver
#datasources.default.url=jdbc:mysql://localhost:3306/anonymous_wall
DATABASE_URL=${DATABASE_URL:jdbc:oracle:thin:@your-adb-connection-string?TNS_ADMIN=/path/to/wallet}
datasources.default.username=${DATABASE_USER:ADMIN}
datasources.default.password=${DATABASE_PASSWORD:}
datasources.default.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML
redis.uri=redis://localhost:6379
micronaut.testresources.enabled=false
context-path=/

# Cache Configuration for BlockedUserFilter
# High-performance in-memory cache for blocked user status
# for isUserBlocked (admin use)
micronaut.caches.blocked-users.maximum-size=10000
micronaut.caches.blocked-users.expire-after-write=5m
micronaut.caches.blocked-users.expire-after-access=2m

# for getCombinedBlockedUserIds / getBlockedUserIds
micronaut.caches.user-block-sets.maximum-size=10000
micronaut.caches.user-block-sets.expire-after-write=5m
micronaut.caches.user-block-sets.expire-after-access=2m