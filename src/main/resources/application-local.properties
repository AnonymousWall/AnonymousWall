# Local Testing Configuration - 100% Production Mimic
# This configuration uses Oracle Database to match production Oracle ADB behavior
# Use with: MICRONAUT_ENVIRONMENTS=local ./mvnw mn:run
# Or with Docker: docker-compose -f docker-compose.local.yml up

# Application name
micronaut.application.name=anonymouswall

# Security Configuration - matches production
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET:LocalTestingSecretKey32CharsMin!!!}

# Oracle Database Configuration - matches production Oracle ADB
# Uses Oracle XE locally instead of cloud ADB, but same driver and dialect
datasources.default.db-type=${DB_TYPE:oracle}
datasources.default.dialect=${DB_DIALECT:ORACLE}
datasources.default.driver-class-name=${DB_DRIVER:oracle.jdbc.OracleDriver}
datasources.default.url=${DATABASE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
datasources.default.username=${DATABASE_USER:system}
datasources.default.password=${DATABASE_PASSWORD:OraclePass123!}

# Connection pool settings - match production
datasources.default.maximum-pool-size=20
datasources.default.minimum-idle=5
datasources.default.connection-timeout=3000
datasources.default.idle-timeout=600000
datasources.default.max-lifetime=1800000

# Liquibase for schema management
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml

# Redis Configuration - matches production
redis.uri=${REDIS_URI:redis://localhost:6379}

# Logging Configuration - local directory
LOG_DIR=${LOG_DIR:./logs}

# Health endpoint - publicly accessible (like production)
endpoints.health.enabled=true
endpoints.health.sensitive=false

# Context path
context-path=/

# Disable test resources (not needed for local testing)
micronaut.testresources.enabled=false

# Production-like optimizations
micronaut.server.netty.max-header-size=16KB
micronaut.server.max-request-size=10MB
micronaut.server.read-timeout=30s

# Email configuration (optional - can be overridden with env vars)
# micronaut.email.from.email=${SMTP_USERNAME:noreply@localhost}
# micronaut.email.from.name=Anonymous Wall
