# Production Configuration
# All sensitive values must be set via environment variables

# Logging Configuration - writes to standard production log directory
LOG_DIR=${LOG_DIR:/app/logs}

micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET:MISSING_REQUIRED}
micronaut.security.token.jwt.generator.access-token.expiration=900
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml

# Database Configuration for OCI Autonomous Database (ADB)
# ADB uses Oracle Database, so we use Oracle JDBC driver and ORACLE dialect
# Connection URL format: jdbc:oracle:thin:@<service-name>?TNS_ADMIN=/path/to/wallet
# Or use the full TCPS connection string from OCI Console
datasources.default.db-type=${DB_TYPE:oracle}
datasources.default.dialect=${DB_DIALECT:ORACLE}
micronaut.application.name=anonymouswall
micronaut.security.authentication=bearer
datasources.default.driver-class-name=${DB_DRIVER:oracle.jdbc.OracleDriver}
datasources.default.url=${DATABASE_URL:MISSING_REQUIRED}
datasources.default.username=${DATABASE_USER:MISSING_REQUIRED}
datasources.default.password=${DATABASE_PASSWORD:MISSING_REQUIRED}
datasources.default.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML
redis.uri=${REDIS_URI:redis://localhost:6379}

# Cache Configuration for BlockedUserFilter
# High-performance in-memory cache for blocked user status
# for isUserBlocked (admin use)
micronaut.caches.blocked-users.maximum-size=10000
micronaut.caches.blocked-users.expire-after-write=5m
micronaut.caches.blocked-users.expire-after-access=2m

# for getCombinedBlockedUserIds / getBlockedUserIds
micronaut.caches.user-block-sets.maximum-size=10000
micronaut.caches.user-block-sets.expire-after-write=5m
micronaut.caches.user-block-sets.expire-after-access=2m

micronaut.caches.national-posts.maximum-size=2000
micronaut.caches.national-posts.expire-after-write=45s
micronaut.caches.national-marketplace.maximum-size=2000
micronaut.caches.national-marketplace.expire-after-write=60s
micronaut.caches.national-internships.maximum-size=2000
micronaut.caches.national-internships.expire-after-write=60s
micronaut.caches.user-post-likes.maximum-size=10000
micronaut.caches.user-post-likes.expire-after-write=15s

micronaut.testresources.enabled=false
context-path=/

# Email Configuration for OCI Email Delivery Service
smtp.user=${SMTP_USERNAME}
smtp.password=${SMTP_PASSWORD}
micronaut.email.from.email=noreply@mail.echo-talk.com
micronaut.email.from.name=Echo Talk
javamail.properties.mail.smtp.port=587
javamail.properties.mail.smtp.auth=true
javamail.properties.mail.smtp.starttls.enable=true
javamail.properties.mail.smtp.host=smtp.email.ca-toronto-1.oci.oraclecloud.com

micronaut.server.multipart.enabled=true
micronaut.server.multipart.max-file-size=10485760
micronaut.server.multipart.disk=true
micronaut.server.max-request-size=15728640

# Health endpoint - publicly accessible for load balancer health checks
endpoints.health.enabled=true
endpoints.health.sensitive=false

# Production optimizations
micronaut.server.idle-timeout=60s
micronaut.server.netty.worker.threads=16
micronaut.executors.io.n-threads=32

datasources.default.max-lifetime=480000
datasources.default.idle-timeout=180000
datasources.default.keepalive-time=45000
# Keep 3 warm, more headroom than before since limit is higher
datasources.default.minimum-idle=3
# 14 per node × 2 nodes = 28 sessions, 2 left for admin/Liquibase
datasources.default.maximum-pool-size=14
# Slightly more generous wait since we have more connections available
datasources.default.connection-timeout=10000
datasources.default.connection-test-query=SELECT 1 FROM DUAL

# For Admin Console CORS Configuration
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins[0]=https://admin.echo-talk.com
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.web.allowed-headers[0]=Authorization
micronaut.server.cors.configurations.web.allowed-headers[1]=Content-Type
micronaut.server.cors.configurations.web.allow-credentials=true
micronaut.server.cors.configurations.web.max-age=3600

# OCI Object Storage for media uploads
oci.media.namespace=${OCI_NAMESPACE}
oci.media.bucket-name=${MEDIA_BUCKET_NAME}
# bucket-url removed â€” object name is stored directly,
# served via /api/v1/media/{objectName}