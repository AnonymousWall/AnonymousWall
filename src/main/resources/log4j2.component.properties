# Log4j2 Component Properties - Production Security Settings
#
# These settings provide defense-in-depth security for log4j2 in production.
# They disable features that could be exploited for remote code execution.
#
# References:
# - CVE-2021-44228 (Log4Shell): JNDI injection vulnerability
# - CVE-2021-45046: Incomplete fix for Log4Shell
# - CVE-2021-45105: DoS via infinite recursion
#
# Last updated: 2026-02-05

# Disable JNDI lookups completely (CVE-2021-44228 mitigation)
# This prevents ${jndi:ldap://...} attacks
log4j2.enableJndi=false

# Disable message pattern lookups (CVE-2021-45046 mitigation)
# This prevents ${...} patterns in log messages from being evaluated
log4j2.formatMsgNoLookups=true

# Disable arbitrary JDBC Appender connections
# Only allow pre-configured JDBC appenders
log4j2.enableJdbc=false

# Disable arbitrary JMS Appender connections
# Only allow pre-configured JMS appenders (we don't use JMS for logging)
log4j2.enableJms=false

# Limit recursion depth to prevent DoS (CVE-2021-45105 mitigation)
log4j2.maxRecursionDepth=5

# Disable ThreadContext garbage-free mode for better security
# (small performance trade-off for security)
log4j2.garbagefreeThreadContextMap=false

# Enable strict XML parsing for configuration files
log4j2.Script.enableLanguages=

# Disable scripts in configuration (no script engines allowed)
log4j2.formatMsgNoLookups=true
