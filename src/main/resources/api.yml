  # =================== Marketplace ===================
  /marketplace:
    post:
      tags: [marketplace]
      summary: Create marketplace item
      description: List an item for sale in the marketplace
      operationId: createItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, price]
              properties:
                title:
                  type: string
                  description: Item title
                description:
                  type: string
                  description: Item description
                price:
                  type: string
                  description: Item price
                category:
                  type: string
                  enum: [textbooks, electronics, furniture, clothing, stationery, sports, transport, food, services, housing, tickets, other]
                  description: Item category
                condition:
                  type: string
                  enum: [new, like-new, good, fair]
                  description: Condition of the item
                wall:
                  type: string
                  enum: [campus, national]
                  default: campus
                  description: Which wall to post to
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Optional image files (JPEG, PNG, or WEBP, max 5MB each, up to 5 images)
      responses:
        "201":
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDTO"
        "400":
          description: Invalid request data
        "401":
          description: Unauthorized - authentication required
    get:
      tags: [marketplace]
      summary: List marketplace items
      description: Browse available items in the marketplace with optional pagination and filtering
      operationId: listItems
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of items per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [newest, price-asc, price-desc]
            default: newest
          description: Sort order for items
        - in: query
          name: wall
          schema:
            type: string
            enum: [campus, national]
            default: campus
          description: Which wall to view marketplace items from
        - in: query
          name: category
          schema:
            type: string
            enum: [textbooks, electronics, furniture, clothing, stationery, sports, transport, food, services, housing, tickets, other]
          description: Filter items by category
      responses:
        "200":
          description: Marketplace items retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItemDTO"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "401":
          description: Unauthorized - authentication required

  /marketplace/{itemId}:
    get:
      tags: [marketplace]
      summary: Get marketplace item by ID
      description: Retrieve a specific marketplace item by its ID
      operationId: getItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID of the marketplace item to retrieve
      responses:
        "200":
          description: Item retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDTO"
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Item not found
    put:
      tags: [marketplace]
      summary: Update marketplace item
      description: Update an existing marketplace item (partial update supported)
      operationId: updateItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
          description: ID of the marketplace item to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDTO"
        "400":
          description: Invalid request data
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - not the owner of the item
        "404":
          description: Item not found

  /marketplace/{itemId}/hide:
    patch:
      tags: [marketplace]
      summary: Hide a marketplace item
      description: Hide a marketplace item (soft-delete). Only the item author can hide their own item.
      operationId: hideItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the marketplace item to hide
      responses:
        "200":
          description: Item hidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Item hidden successfully
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - You can only hide your own items
        "404":
          description: Item not found

  /marketplace/{itemId}/unhide:
    patch:
      tags: [marketplace]
      summary: Unhide a marketplace item
