components:
  schemas:

    # ----- Auth -----
    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        profileName:
          type: string
          description: User's profile name (default "Anonymous")
        isVerified:
          type: boolean
        passwordSet:
          type: boolean
          description: true if user has already set a password
        createdAt:
          type: string
          format: date-time

    # ----- Auth Requests/Responses -----
    SendEmailCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [register, login, reset_password]
          description: The purpose of the verification code

    RegisterEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit verification code sent to email
          example: "839214"

    LoginEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit verification code sent to email
          example: "839214"

    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: User's password

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          description: New password (minimum 8 characters)

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: Current password for verification
        newPassword:
          type: string
          minLength: 8
          description: New password (minimum 8 characters)

    PasswordResetRequestRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email address of the account

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit verification code sent to email
          example: "839214"
        newPassword:
          type: string
          minLength: 8
          description: New password (minimum 8 characters)

    UpdateProfileNameRequest:
      type: object
      required: [profileName]
      properties:
        profileName:
          type: string
          minLength: 1
          maxLength: 255
          description: New profile name (can be empty string to reset to "Anonymous")

    # ----- Posts -----
    CreatePostRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Post title
        content:
          type: string
          minLength: 0
          maxLength: 5000
          description: Post content text (optional for poll posts)
        wall:
          type: string
          enum: [campus, national]
          default: campus
          description: Which wall to post to
        postType:
          type: string
          enum: [standard, poll]
          default: standard
          description: Type of post
        pollOptions:
          type: array
          items:
            type: string
            maxLength: 100
          minItems: 2
          maxItems: 4
          description: Poll options (required when postType=poll, 2-4 items)

    PostDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Post title
        content:
          type: string
        wall:
          type: string
          enum: [campus, national]
          description: Which wall the post is on
        author:
          type: object
          properties:
            id:
              type: string
            profileName:
              type: string
              description: Profile name of the post author
            isAnonymous:
              type: boolean
              description: Whether author is anonymous
        likes:
          type: integer
          description: Number of likes
        comments:
          type: integer
          description: Number of comments
        liked:
          type: boolean
          description: Whether current user has liked this post
        imageUrls:
          type: array
          items:
            type: string
          description: URLs of images attached to the post (up to 5)
        postType:
          type: string
          enum: [standard, poll]
          description: Type of post
        totalVotes:
          type: integer
          nullable: true
          description: Total votes for poll posts (null for standard posts)
        poll:
          $ref: "#/components/schemas/PollDTO"
          nullable: true
          description: Poll data (null for standard posts)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PollDTO:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionDTO"
        totalVotes:
          type: integer
          description: Total number of votes cast
        userVotedOptionId:
          type: string
          format: uuid
          nullable: true
          description: The option ID the current user voted for, or null if not voted
        resultsVisible:
          type: boolean
          description: Whether vote counts and percentages are visible

    PollOptionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        optionText:
          type: string
          description: The text of the poll option
        displayOrder:
          type: integer
          description: Display order of the option (0-3)
        voteCount:
          type: integer
          nullable: true
          description: Number of votes for this option (null when results not visible)
        percentage:
          type: number
          format: double
          nullable: true
          description: Percentage of total votes (null when results not visible)

    VoteRequest:
      type: object
      required: [optionId]
      properties:
        optionId:
          type: string
          format: uuid
          description: ID of the poll option to vote for

    PollVoteResultDTO:
      type: object
      properties:
        poll:
          $ref: "#/components/schemas/PollDTO"
        message:
          type: string
          description: Success message

    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Comment text content

    CommentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
          description: ID of the parent entity (post, internship, or marketplace item)
        parentType:
          type: string
          enum: [POST, INTERNSHIP, MARKETPLACE]
          description: Type of the parent entity
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        author:
          type: object
          properties:
            id:
              type: string
            profileName:
              type: string
              description: Profile name of the comment author
            isAnonymous:
              type: boolean

    # ----- Internships -----
    CreateInternshipRequest:
      type: object
      required: [company, role]
      properties:
        company:
          type: string
          description: Company name
        role:
          type: string
          description: Internship role/title
        salary:
          type: string
          description: Salary or stipend information
        location:
          type: string
          description: Job location
        description:
          type: string
          description: Detailed job description
        deadline:
          type: string
          format: date
          description: Application deadline
        wall:
          type: string
          enum: [campus, national]
          default: campus
          description: Which wall to post to

    InternshipDTO:
      type: object
      properties:
        id:
          type: string
        company:
          type: string
        role:
          type: string
        salary:
          type: string
        location:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date
        wall:
          type: string
          enum: [campus, national]
          description: Which wall the internship is on
        comments:
          type: integer
          description: Number of comments
        author:
          type: object
          properties:
            id:
              type: string
            profileName:
              type: string
              description: Profile name of the posting author
            isAnonymous:
              type: boolean
              description: Whether author is anonymous
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ----- Marketplace -----
    CreateItemRequest:
      type: object
      required: [title, price]
      properties:
        title:
          type: string
          description: Item title
        description:
          type: string
          description: Item description
        price:
          type: number
          format: float
          description: Item price
        category:
          type: string
          enum: [textbooks, electronics, furniture, clothing, stationery, sports, transport, food, services, housing, tickets, other]
          description: Item category
        condition:
          type: string
          enum: [new, like-new, good, fair]
          description: Condition of the item
        wall:
          type: string
          enum: [campus, national]
          default: campus
          description: Which wall to post to

    UpdateItemRequest:
      type: object
      description: Request body for updating a marketplace item. All fields are optional for partial updates.
      properties:
        title:
          type: string
          description: Item title
        description:
          type: string
          description: Item description
        price:
          type: number
          format: float
          description: Item price
        category:
          type: string
          enum: [textbooks, electronics, furniture, clothing, stationery, sports, transport, food, services, housing, tickets, other]
          description: Item category
        condition:
          type: string
          enum: [new, like-new, good, fair]
          description: Condition of the item

    ItemDTO:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
          enum: [textbooks, electronics, furniture, clothing, stationery, sports, transport, food, services, housing, tickets, other]
        condition:
          type: string
