    AdminMarketplaceDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        profileName:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string
        condition:
          type: string
        wall:
          type: string
          enum: [campus, national]
        schoolDomain:
          type: string
        commentCount:
          type: integer
        hidden:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string
          description: URLs of images attached to the item (up to 5)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminConversationDTO:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        participantIds:
          type: array
          items:
            type: string
            format: uuid
        lastMessageAt:
          type: string
          format: date-time
        messageCount:
          type: integer

    AdminReportDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [POST, COMMENT]
        targetId:
          type: string
          format: uuid
          description: Post ID for POST reports, Comment ID for COMMENT reports
        reporterUserId:
          type: string
          format: uuid
        reportedUserId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, RESOLVED, REJECTED]
        createdAt:
          type: string
          format: date-time

    # ----- Chat DTOs -----
    ChatMessageDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        receiverId:
          type: string
          format: uuid
        content:
          type: string
          description: Message content
        imageUrl:
          type: string
          description: URL of the attached image
        readStatus:
          type: boolean
          description: Whether the message has been read
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required:
        - receiverId
      properties:
        receiverId:
          type: string
          format: uuid
          description: UUID of the message receiver
        content:
          type: string
          maxLength: 5000
          description: Message content (optional if imageUrl is provided)
        imageUrl:
          type: string
          description: URL of the attached image (optional if content is provided)

    ConversationDTO:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: The other user's ID
        profileName:
          type: string
          description: The other user's profile name
        lastMessage:
          $ref: "#/components/schemas/ChatMessageDTO"
        unreadCount:
          type: integer
          description: Number of unread messages from this user

    BlockedUserDTO:
      type: object
      properties:
        blockedUserId:
          type: string
          format: uuid
          description: ID of the blocked user
        profileName:
          type: string
          description: Profile name of the blocked user
        createdAt:
          type: string
          format: date-time
          description: When the block was created

    # ----- Pagination -----
    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items
        totalPages:
          type: integer
          description: Total number of pages

    # ----- Device -----
    RegisterDeviceRequest:
      type: object
      required:
        - deviceToken
        - platform
      properties:
        deviceToken:
          type: string
          description: The iOS device push token
        platform:
          type: string
          enum:
            - IOS
          description: Device platform (currently only IOS is supported)

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
