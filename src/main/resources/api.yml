openapi: 3.0.0
info:
  title: Campus Wall API
  version: "1.0.0"
  description: API for campus social features

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: posts
  - name: walls
  - name: users
  - name: chat
  - name: internships
  - name: marketplace
  - name: coins
  - name: devices
  - name: admin

paths:

  # =================== Auth ===================

  # Email Verification Code Endpoints
  /auth/email/send-code:
    post:
      tags: [auth]
      summary: Send email verification code
      description: Send a 6-digit verification code to the user's email for registration, login, or password reset
      operationId: sendEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailCodeRequest"
      responses:
        "200":
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification code sent to email"
        "400":
          description: Invalid email or request

  # Registration Flow - Email Code Based
  /auth/register/email:
    post:
      tags: [auth]
      summary: Register account with email verification code
      description: Create a new account using email and verification code. Password setup is optional initially.
      operationId: registerWithEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEmailRequest"
      responses:
        "201":
          description: Account registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token for authenticated requests
                  user:
                    $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid code, email already exists, or invalid request
        "409":
          description: Email already registered

  # Login Flow - Email Code Based
  /auth/login/email:
    post:
      tags: [auth]
      summary: Login with email verification code
      description: Authenticate user with email and verification code (password-less login)
      operationId: loginWithEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginEmailRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token for authenticated requests
                  user:
                    $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid code or email
        "401":
          description: Authentication failed

  # Login Flow - Password Based
  /auth/login/password:
    post:
      tags: [auth]
      summary: Login with email and password
      description: Authenticate user with email and password (if password is set)
      operationId: loginWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token for authenticated requests
                  user:
                    $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid email or password
        "401":
          description: Authentication failed

  # Password Management - Set Initial Password
  /auth/password/set:
    post:
      tags: [auth]
      summary: Set password for the first time
      description: Set an initial password after registration with email code. Requires authentication.
      operationId: setPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: Password set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid password or request
        "401":
          description: Unauthorized - authentication required

  # Password Management - Change Password (Authenticated)
  /auth/password/change:
    post:
      tags: [auth]
      summary: Change password (when already logged in)
      description: Change current password. Requires authentication and verification of old password.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid old password or invalid new password
        "401":
          description: Unauthorized - authentication required

  # Password Management - Forgot Password Request
  /auth/password/reset-request:
    post:
      tags: [auth]
      summary: Request password reset (forgot password)
      description: Request a password reset by sending a verification code to the email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequest"
      responses:
        "200":
          description: Verification code sent for password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset code sent to email"
        "400":
          description: Invalid email
        "404":
          description: Email not found

  # Password Management - Reset Password with Code
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Reset password with verification code (forgot password flow)
      description: Complete password reset using email and verification code
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token for authenticated requests
                  user:
                    $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid code, email, or password
        "401":
          description: Verification failed

  # =================== Posts ===================
  /posts:
    post:
      tags: [posts]
      summary: Create a new post
      description: Create a new anonymous post on the wall. Image upload is optional.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Post title
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: Post content text
                wall:
                  type: string
                  enum: [campus, national]
                  default: campus
                  description: Which wall to post to
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: Optional image files (JPEG, PNG, or WEBP, max 5MB each, up to 5 images)
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDTO"
        "400":
          description: Invalid request data
        "401":
          description: Unauthorized - authentication required
    get:
      tags: [posts]
      summary: List posts
      description: Retrieve posts from campus or national wall with optional pagination
      operationId: listPosts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: wall
          required: false
          schema:
            type: string
            enum: [campus, national]
            default: campus
          description: Wall filter (campus or national)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of posts per page
        - in: query
          name: sort
          schema:
            type: string
            enum: [NEWEST, OLDEST, MOST_LIKED, LEAST_LIKED, MOST_COMMENTED, LEAST_COMMENTED]
            default: NEWEST
          description: Sort order for posts
      responses:
        "200":
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostDTO"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "401":
          description: Unauthorized - authentication required

  /posts/{postId}:
    get:
      tags: [posts]
      summary: Get post by ID
      description: Retrieve a single post by its ID
      operationId: getPostById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post to retrieve
      responses:
        "200":
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDTO"
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - no access to this post
        "404":
          description: Post not found

  /posts/{postId}/vote:
    post:
      tags: [posts]
      summary: Vote on a poll
      description: Cast a vote on a poll post. Each user can only vote once per poll.
      operationId: voteOnPoll
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the poll post to vote on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Vote cast successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollVoteResultDTO"
        "400":
          description: Invalid request or post is not a poll
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Post or option not found
        "409":
          description: User has already voted on this poll

  /posts/{postId}/poll:
    get:
      tags: [posts]
      summary: Get poll data for a post
      description: Retrieve poll options and results for a poll post.
      operationId: getPoll
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the poll post
        - in: query
          name: viewResults
          required: false
          schema:
            type: boolean
            default: false
          description: If true, returns vote counts and percentages even if the user hasn't voted
      responses:
        "200":
          description: Poll data retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollDTO"
        "400":
          description: Post is not a poll
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Post not found

  /posts/{postId}/comments:
    post:
      tags: [posts]
      summary: Add comment to post
      description: Add a comment to an existing post
      operationId: addComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post to comment on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDTO"
        "400":
          description: Invalid request data
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Post not found

  /posts/{postId}/likes:
    post:
      tags: [posts]
      summary: Like a post
      description: Add a like to a post (toggle-like behavior)
      operationId: likePost
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post to like
      responses:
        "200":
          description: Like added/removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                    description: true if post is now liked, false if unliked
                  likeCount:
                    type: integer
                    format: int64
                    description: Total number of likes on the post
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Post not found

  /posts/{postId}/comments/{commentId}/hide:
    patch:
      tags: [posts]
      summary: Hide a comment
      description: Hide a comment (soft-delete). Only the comment author can hide their own comment.
      operationId: hideComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post
        - in: path
          name: commentId
          required: true
          schema:
            type: string
          description: ID of the comment to hide
      responses:
        "200":
          description: Comment hidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comment hidden successfully"
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - only comment author can hide their own comment
        "404":
          description: Post or comment not found

  /posts/{postId}/comments/{commentId}/unhide:
    patch:
      tags: [posts]
      summary: Unhide a comment
      description: Unhide a previously hidden comment (undo soft-delete). Only the comment author can unhide their own comment.
      operationId: unhideComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post
        - in: path
          name: commentId
          required: true
          schema:
            type: string
          description: ID of the comment to unhide
      responses:
        "200":
          description: Comment unhidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comment unhidden successfully"
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - only comment author can unhide their own comment
        "404":
          description: Post or comment not found

  /posts/{postId}/hide:
    patch:
      tags: [posts]
      summary: Hide a post
      description: Hide a post (soft-delete). Only the post author can hide their own post. When a post is hidden, all its comments are also hidden.
      operationId: hidePost
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post to hide
      responses:
        "200":
          description: Post hidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post hidden successfully"
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - only post author can hide their own post
        "404":
          description: Post not found

  /posts/{postId}/unhide:
    patch:
      tags: [posts]
      summary: Unhide a post
      description: Unhide a previously hidden post (undo soft-delete). Only the post author can unhide their own post. When a post is unhidden, all its comments are restored.
      operationId: unhidePost
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post to unhide
      responses:
        "200":
          description: Post unhidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post unhidden successfully"
        "401":
          description: Unauthorized - authentication required
        "403":
          description: Forbidden - only post author can unhide their own post
        "404":
          description: Post not found

  /posts/{postId}/reports:
    post:
      tags: [posts]
      summary: Report a post
      description: Report a post for inappropriate content or policy violation. A user can only report the same post once. Reporting increments the post author's report count.
      operationId: reportPost
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post to report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "201":
          description: Post reported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post reported successfully"
        "400":
          description: Invalid request or user has already reported this post
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Post not found

  /posts/{postId}/comments/{commentId}/reports:
    post:
      tags: [posts]
      summary: Report a comment
      description: Report a comment for inappropriate content or policy violation. A user can only report the same comment once. Reporting increments the comment author's report count.
      operationId: reportComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID of the post
        - in: path
          name: commentId
          required: true
          schema:
            type: string
          description: ID of the comment to report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "201":
          description: Comment reported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comment reported successfully"
        "400":
          description: Invalid request or user has already reported this comment
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Post or comment not found

  # =================== Walls ===================
  /walls/campus:
    get:
      tags: [walls]
      summary: Get campus wall
      description: Retrieve posts from the campus wall with optional pagination. Campus-specific content visible only to authenticated users.
      operationId: getCampusWall
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of posts per page
      responses:
        "200":
          description: Campus wall posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostDTO"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "401":
          description: Unauthorized - authentication required

  /walls/national:
    get:
      tags: [walls]
      summary: Get national wall
      description: Retrieve posts from the national wall with optional pagination. Requires authentication.
      operationId: getNationalWall
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of posts per page
      responses:
        "200":
          description: National wall posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostDTO"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "401":
          description: Unauthorized - authentication required

  # =================== Internships ===================
  /internships:
    post:
      tags: [internships]
      summary: Create internship posting
      description: Create a new internship opportunity posting
      operationId: createInternship
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInternshipRequest"
      responses:
        "201":
          description: Internship posting created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipDTO"
        "400":
          description: Invalid request data
        "401":
          description: Unauthorized - authentication required
    get:
      tags: [internships]
      summary: List internship postings
      description: Retrieve available internship postings with optional pagination and filtering
      operationId: listInternships
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of postings per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
          description: Sort order for internship postings
        - in: query
          name: wall
          schema:
            type: string
            enum: [campus, national]
            default: campus
          description: Which wall to view internship postings from
      responses:
        "200":
          description: Internship postings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InternshipDTO"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "401":
          description: Unauthorized - authentication required

  /internships/{internshipId}:
    get:
      tags: [internships]
      summary: Get internship posting by ID
      description: Retrieve a specific internship posting by its ID
      operationId: getInternship
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: internshipId
          required: true
          schema:
            type: string
          description: ID of the internship posting to retrieve
      responses:
        "200":
          description: Internship posting retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipDTO"
        "404":
          description: Internship posting not found
        "401":
          description: Unauthorized - authentication required

  /internships/{internshipId}/hide:
    patch:
      tags: [internships]
      summary: Hide an internship posting
      description: Hide an internship posting (soft-delete). Only the posting author can hide their own posting.
      operationId: hideInternship
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: internshipId
          required: true
          schema:
            type: string
          description: ID of the internship posting to hide
      responses:
        "200":
          description: Internship posting hidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Internship posting not found
        "403":
          description: Forbidden - You can only hide your own postings
        "401":
          description: Unauthorized - authentication required

  /internships/{internshipId}/unhide:
    patch:
      tags: [internships]
      summary: Unhide an internship posting
      description: Unhide a previously hidden internship posting. Only the posting author can unhide their own posting.
      operationId: unhideInternship
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: internshipId
          required: true
          schema:
            type: string
          description: ID of the internship posting to unhide
      responses:
        "200":
          description: Internship posting unhidden successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Internship posting not found
        "403":
          description: Forbidden - You can only unhide your own postings
        "401":
          description: Unauthorized - authentication required

  /internships/{internshipId}/comments:
    post:
      tags: [internships]
      summary: Add comment to internship posting
      description: Add a comment to an existing internship posting
      operationId: addInternshipComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: internshipId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the internship posting to comment on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDTO"
        "400":
          description: Invalid request
        "404":
          description: Internship posting not found
    get:
      tags: [internships]
      summary: Get comments for internship posting
      description: Get comments for an internship posting with pagination and sorting
      operationId: getInternshipComments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: internshipId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the internship posting
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
