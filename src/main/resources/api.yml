          properties:
            id:
              type: string
            profileName:
              type: string
              description: Profile name of the item author
            isAnonymous:
              type: boolean
              description: Whether author is anonymous
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

