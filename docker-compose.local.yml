# Local testing environment that 100% mimics production behavior
# Uses Oracle Database Express Edition (XE) to match production Oracle ADB
# This provides the closest match to production Oracle Autonomous Database behavior
# Use with: docker-compose -f docker-compose.local.yml up -d

services:
  # Oracle Database XE - Mimics production Oracle Autonomous Database (ADB)
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: anonymouswall-oracle-local
    environment:
      # Oracle password requirements: 12-30 chars, uppercase, lowercase, number, special char
      - ORACLE_PWD=OraclePass123!
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"  # Oracle listener
      - "5500:5500"  # Oracle Enterprise Manager
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-scripts:/opt/oracle/scripts/startup
    restart: unless-stopped
    networks:
      - anonymouswall-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/OraclePass123!@//localhost:1521/XE"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Oracle XE needs more resources
    shm_size: 1gb

  # Application - configured to use Oracle just like production
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonymouswall-backend-local
    ports:
      - "8080:8080"
    environment:
      # Use prod-like environment settings
      - MICRONAUT_ENVIRONMENTS=local
      
      # JWT Secret - MUST be set for testing
      - JWT_GENERATOR_SIGNATURE_SECRET=${JWT_GENERATOR_SIGNATURE_SECRET:-LocalTestingSecretKey32CharsMin!!!}
      
      # Oracle Database configuration - matches production ADB setup
      # Connection to local Oracle XE instead of cloud ADB
      - DATABASE_URL=jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      - DATABASE_USER=${DATABASE_USER:-system}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-OraclePass123!}
      - DB_TYPE=oracle
      - DB_DIALECT=ORACLE
      - DB_DRIVER=oracle.jdbc.OracleDriver
      
      # Redis configuration
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      
      # Logging
      - LOG_DIR=/app/logs
      
      # Email configuration (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      
    volumes:
      # Persist logs
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anonymouswall-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 90s

  # Redis - same as production
  redis:
    image: redis:7-alpine
    container_name: anonymouswall-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - anonymouswall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  oracle-data:
    driver: local
  redis-data:
    driver: local

networks:
  anonymouswall-network:
    driver: bridge
